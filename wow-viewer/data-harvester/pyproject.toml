[build-system]
requires = ["setuptools>=81"]
build-backend = "setuptools.build_meta"

[project]
name = "wowviewer-harvester"
version = "0.1.0"
description = "WowViewer data harvesting, training, and inference pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bitsandbytes>=0.43",
    "numpy>=2.0",
    "peft>=0.10",
    "torch>=2.5",
    "timm>=1.0",
    "transformers>=4.52",
    "zarr>=2.0",
    "numcodecs>=0.13",
    "triton-windows>=3.7",
    "pyarrow>=24.0.0",
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "pillow>=10.0",
    "spandrel>=0.4.2",
    "lpips>=0.1.4",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
    "matplotlib>=3.8",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests", "src/harvester"]
markers = [
    "v23: Spec 089 V23 height predictor tests",
    "v24: Spec 094 WDL prior + lattice detailer tests",
]
