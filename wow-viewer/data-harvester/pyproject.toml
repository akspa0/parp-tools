[project]
name = "wowviewer-harvester"
version = "0.1.0"
description = "WowViewer data harvesting, training, and inference pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.0",
    "torch>=2.5",
    "timm>=1.0",
    "transformers>=4.52",
    "zarr>=2.0",
    "numcodecs>=0.13",
    "triton-windows>=3.7",
    "pyarrow>=24.0.0",
    "scipy>=1.12",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.uv]
dev-dependencies = [
    "pytest>=8.0",
    "ruff>=0.8",
    "matplotlib>=3.8",
]

[tool.uv.sources]
torch = { index = "pytorch-cu130" }

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["src/harvester"]
