name: WoWViewer build

# wow-viewer/ is a .NET 10 solution inside this repo (the GitHub repo is akspa0/parp-tools,
# not a submodule). Every push that touches the build inputs produces downloadable,
# self-contained binaries for all four targets as workflow artifacts.
#
# Releases live in wowviewer-release.yml, which calls this workflow via workflow_call and
# then attaches the artifacts to a GitHub Release. The tag trigger deliberately does NOT
# live here: `on.push` applies its `paths` filter to tag pushes too, so a release tag whose
# commit happens to touch only docs would silently build nothing.
#
# Platform layout:
#   - Windows publishes WoWViewer.csproj (net10.0-windows) — the full viewer incl. native
#     WinForms file dialogs.
#   - Linux/macOS publish WoWViewer.CrossPlatform.csproj (plain net10.0). BLP decoding uses
#     ImageSharp everywhere now (the old System.Drawing/GDI+ path was Windows-only at runtime),
#     so these are functional. Known limitation: native file dialogs are Windows-only and
#     no-op elsewhere — load content via the CLI flags (--game-path, --build, --world).
#   - No test job: the suite has pre-existing failures unrelated to whether the viewer builds
#     or runs (game-data-dependent + separate known bugs, tracked in memory-bank/progress.md),
#     and per project direction the build must not be gated on it.

on:
  push:
    branches: [main, v0.5.0-prerelease]
    paths:
      - 'wow-viewer/src/**'
      - 'wow-viewer/tools/**'
      - 'wow-viewer/libs/**'
      - 'wow-viewer/*.props'
      - 'wow-viewer/*.slnx'
      - '.github/workflows/wowviewer-build.yml'
  pull_request:
    paths:
      - 'wow-viewer/src/**'
      - 'wow-viewer/tools/**'
      - 'wow-viewer/libs/**'
      - 'wow-viewer/*.props'
      - 'wow-viewer/*.slnx'
      - '.github/workflows/wowviewer-build.yml'
  workflow_dispatch:
  workflow_call:

concurrency:
  group: wowviewer-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  # Scoped to exactly the submodules wow-viewer's build needs — NOT `submodules: true` on
  # checkout, which would also pull unrelated, much larger submodules elsewhere in this repo
  # (gillijimproject_refactor's Depth-Anything-3, PM4Tool/lib/*, dirac, headroom).
  SUBMODULE_PATHS: >-
    wow-viewer/libs/Marlamin/WoWTools.Minimaps
    wow-viewer/libs/ModernWoWTools/Warcraft.NET
    wow-viewer/libs/WoW-Tools/SereniaBLPLib
    wow-viewer/libs/wowdev/DBCD
    wow-viewer/libs/wowdev/WoWDBDefs
    wow-viewer/libs/wowdev/wow-listfile

jobs:
  build:
    name: Build ${{ matrix.os_label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            project: wow-viewer/src/viewer/WoWViewer/WoWViewer.csproj
            os_label: Windows x64
          - os: ubuntu-latest
            rid: linux-x64
            project: wow-viewer/src/viewer/WoWViewer/WoWViewer.CrossPlatform.csproj
            os_label: Linux x64
          - os: macos-latest
            rid: osx-arm64
            project: wow-viewer/src/viewer/WoWViewer/WoWViewer.CrossPlatform.csproj
            os_label: macOS arm64
          - os: macos-latest
            rid: osx-x64
            project: wow-viewer/src/viewer/WoWViewer/WoWViewer.CrossPlatform.csproj
            os_label: macOS x64 (Intel)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Init wow-viewer vendored-lib submodules
        run: git submodule update --init --depth 1 -- ${{ env.SUBMODULE_PATHS }}
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Publish self-contained (${{ matrix.rid }})
        run: >
          dotnet publish ${{ matrix.project }}
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=false
          -o publish/${{ matrix.rid }}
      # Notes are selected by tag when this runs for a release, and otherwise fall back to the
      # highest-versioned notes file. Never hardcode a version here — a stale filename ships the
      # wrong changelog inside every platform archive.
      - name: Bundle README and release notes
        shell: bash
        run: |
          set -euo pipefail
          cp wow-viewer/README.md "publish/${{ matrix.rid }}/README.md"
          notes=""
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ -f "wow-viewer/docs/releases/${GITHUB_REF_NAME}.md" ]; then
            notes="wow-viewer/docs/releases/${GITHUB_REF_NAME}.md"
          else
            notes="$(ls -1 wow-viewer/docs/releases/v*.md | sort -V | tail -1)"
          fi
          echo "Bundling release notes: $notes"
          cp "$notes" "publish/${{ matrix.rid }}/CHANGES-$(basename "$notes" .md).md"
      # upload-artifact zips the directory automatically, so downloading this artifact from the
      # Actions run yields ParpToolsWoWViewer-<rid>.zip with the self-contained build inside.
      # No manual zip step (avoids per-runner shell differences for zip/Compress-Archive).
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParpToolsWoWViewer-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}/
          if-no-files-found: error
