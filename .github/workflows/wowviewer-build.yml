name: WoWViewer build

# Scope: wow-viewer/ is a .NET 10 solution inside this repo (not a submodule — the actual
# GitHub repo is akspa0/parp-tools). Only the C#/build-relevant paths trigger this workflow.
#
# Platform reality (audited 2026-07-14, see memory-bank/activeContext.md):
#   - The real, functional viewer binary is Windows-only today: WoWViewer.csproj targets
#     net10.0-windows (WinForms file dialogs). This is what "build-windows" produces and what
#     "publish-release" ships.
#   - WoWViewer.CrossPlatform.csproj (plain net10.0, no WinForms) already exists and compiles
#     on Linux, but is NOT functionally cross-platform yet: BlpFile.GetBitmap() (System.Drawing/
#     GDI+) is used throughout the actual rendering/export call sites and throws
#     PlatformNotSupportedException at runtime on non-Windows since .NET 7. The cross-platform-
#     safe BlpFile.GetImage() (ImageSharp) already exists and is already used correctly in
#     BlpRgbReader.cs/AlphaBlpCompatibilityService.cs — swapping the ~19 remaining call sites is
#     future work, not done here. So "build-linux-crossplatform-check" is compile-only, to catch
#     regressions in the existing port without claiming a working Linux viewer.
#   - WowViewer.Tool.ValidationCapture is deliberately, permanently Windows-only by design
#     (throws PlatformNotSupportedException itself for GPU capture) — never attempted on Linux.

on:
  push:
    branches: [main, v0.5.0-prerelease]
    paths:
      - 'wow-viewer/src/**'
      - 'wow-viewer/tools/**'
      - 'wow-viewer/libs/**'
      - 'wow-viewer/tests/**'
      - 'wow-viewer/*.props'
      - 'wow-viewer/*.slnx'
      - '.github/workflows/wowviewer-build.yml'
    tags:
      - 'v*'
  pull_request:
    paths:
      - 'wow-viewer/src/**'
      - 'wow-viewer/tools/**'
      - 'wow-viewer/libs/**'
      - 'wow-viewer/tests/**'
      - 'wow-viewer/*.props'
      - 'wow-viewer/*.slnx'
      - '.github/workflows/wowviewer-build.yml'
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'Publish a win-x64 release build as a GitHub Release'
        type: boolean
        default: false

concurrency:
  group: wowviewer-build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'

jobs:
  build-and-test-windows:
    name: Build + test (Windows, real viewer)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore
        run: dotnet restore wow-viewer/WowViewer.slnx

      - name: Build (Release)
        run: dotnet build wow-viewer/WowViewer.slnx -c Release --no-restore

      - name: Test
        # Many tests under tests/WowViewer.Core.Tests and .PM4.Tests are named *RealData*/
        # *Corpus* and read from a staged WoW client at output/tmp/wowarchive-clients (see
        # AdtRealDataTestCatalog.GetStagedClients — returns [] cleanly when that dir is
        # absent, which is the expected state on a fresh CI checkout: staged clients are
        # local-only, never committed, per AGENTS.md). Locally, this dev machine has a
        # *partial* staged corpus, which surfaced ~20 pre-existing failures (missing specific
        # files within an otherwise-present corpus) unrelated to any change in this workflow.
        # Deliberately NOT continue-on-error: publish-release `needs` this job, so a real test
        # failure must keep blocking a release. If corpus-dependent tests still fail on this
        # first clean-checkout run, that's an accurate signal (no corpus exists here either) —
        # the fix then is a proper skip-if-corpus-absent guard in those tests, not a CI bypass.
        run: dotnet test wow-viewer/WowViewer.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-windows
          path: '**/test-results.trx'
          if-no-files-found: ignore

  build-linux-crossplatform-check:
    name: Build check (Linux, compile-only — see header note)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Advisory only: keeps the existing cross-platform port from bit-rotting further without
    # claiming it produces a working Linux viewer yet (BLP/GDI+ runtime gap, see header).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Build cross-platform viewer target
        run: dotnet build wow-viewer/src/viewer/WoWViewer/WoWViewer.CrossPlatform.csproj -c Release

      - name: Build portable CLI tools (confirmed no Windows-only runtime dependency)
        run: |
          dotnet build wow-viewer/tools/inspect/WowViewer.Tool.Inspect/WowViewer.Tool.Inspect.csproj -c Release
          dotnet build wow-viewer/tools/wdl-read/WowViewer.Tool.WdlRead/WowViewer.Tool.WdlRead.csproj -c Release
          dotnet build wow-viewer/tools/enrich/WowViewer.Tool.V22Enrich/WowViewer.Tool.V22Enrich.csproj -c Release
          dotnet build wow-viewer/tools/converter/WowViewer.Tool.Converter/WowViewer.Tool.Converter.csproj -c Release

  publish-release:
    name: Publish win-x64 release build
    needs: build-and-test-windows
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish_release)
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Publish self-contained win-x64
        run: >
          dotnet publish wow-viewer/src/viewer/WoWViewer/WoWViewer.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=false
          -o publish/win-x64

      - name: Zip publish output
        shell: pwsh
        run: Compress-Archive -Path publish/win-x64/* -DestinationPath ParpToolsWoWViewer-win-x64.zip

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ParpToolsWoWViewer-win-x64
          path: ParpToolsWoWViewer-win-x64.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: gh release create "${{ github.ref_name }}" ParpToolsWoWViewer-win-x64.zip --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
