name: Build V9 Trainer Image

on:
  workflow_dispatch:
    inputs:
      push_image:
        description: Push the built image to GHCR
        required: false
        default: true
        type: boolean
      extra_tag:
        description: Optional extra image tag (for example v9-runpod-test)
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/build-v9-trainer-image.yml'
      - 'gillijimproject_refactor/.dockerignore'
      - 'gillijimproject_refactor/docker/v9-trainer/**'
      - 'gillijimproject_refactor/scripts/requirements_train_v7.txt'
      - 'gillijimproject_refactor/src/WoWMapConverter/scripts/train_v9.py'
      - 'gillijimproject_refactor/src/WoWMapConverter/scripts/train_v9_optimized.py'
      - 'gillijimproject_refactor/src/WoWMapConverter/scripts/v7_losses.py'

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/parp-tools-v9-trainer

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=raw,value=${{ inputs.extra_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.extra_tag != '' }}

      - name: Log in to GHCR
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: ./gillijimproject_refactor
          file: ./gillijimproject_refactor/docker/v9-trainer/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'workflow_dispatch' || inputs.push_image }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summarize image tags
        shell: bash
        run: |
          {
            echo "## V9 Trainer Image"
            echo
            echo "Image: \`${IMAGE_NAME}\`"
            echo
            echo "Tags:"
            while IFS= read -r tag; do
              echo "- \`${tag}\`"
            done <<< "${{ steps.meta.outputs.tags }}"
          } >> "$GITHUB_STEP_SUMMARY"
